<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Agency Calculator PRO</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #F8FAFC;
            --bg-card: #FFFFFF;
            --txt-main: #0F172A;
            --txt-muted: #64748B;
            --accent-blue: #1E40AF;
            --accent-red: #DC2626;
            --bg-res: #F1F5F9;
            --border: #E2E8F0;
            --profit-green: #1E4620;
        }

        body.tg-theme {
            --bg-main: var(--tg-theme-bg-color, #F8FAFC);
            --bg-card: var(--tg-theme-secondary-bg-color, #FFFFFF);
            --txt-main: var(--tg-theme-text-color, #0F172A);
            --txt-muted: var(--tg-theme-hint-color, #64748B);
            --accent-blue: var(--tg-theme-button-color, #1E40AF);
            --bg-res: var(--tg-theme-secondary-bg-color, #F1F5F9);
            --border: rgba(128, 128, 128, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--txt-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--accent-blue);
        }

        h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--txt-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--txt-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            background-color: var(--bg-card);
            color: var(--txt-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .results-box {
            background-color: var(--bg-res);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row.bold {
            font-weight: 600;
        }

        .row.profit span:last-child {
            font-size: 18px;
            font-weight: 700;
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 8px 0;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            margin-top: 15px;
        }

        /* Стили для печати/PDF */
        @media print {
            body { background: white; color: black; padding: 0; }
            .btn, h2, .btn-secondary { display: none !important; }
            input { border: none; padding: 0; background: transparent; font-size: 14px; }
            .results-box { background: transparent; border: 1px solid #000; }
        }
    </style>
</head>
<body class="tg-theme">

<div class="container">
    <h2>Event Agency Budget Intelligence PRO</h2>
    
    <h3>1. Основные параметры</h3>
    <div class="input-group">
        <label>Цена за человека в час (₽)</label>
        <input type="number" id="price" value="1500" oninput="calculate()">
    </div>
    <div class="grid-2">
        <div class="input-group">
            <label>Продолжительность (ч)</label>
            <input type="number" id="hours" value="3" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Количество участников</label>
            <input type="number" id="guests" value="20" oninput="calculate()">
        </div>
    </div>
    <div class="input-group">
        <label>Прямые расходы на декор/костюмы (₽)</label>
        <input type="number" id="costs" value="6500" oninput="calculate()">
    </div>

    <h3>2. Гонорары команды (Подрядчики)</h3>
    <div class="grid-2">
        <div class="input-group">
            <label>Ведущий (₽)</label>
            <input type="number" id="pay_host" value="15000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Диджей (₽)</label>
            <input type="number" id="pay_dj" value="8000" oninput="calculate()">
        </div>
    </div>
    <div class="grid-2">
        <div class="input-group">
            <label>Координатор (₽)</label>
            <input type="number" id="pay_coord" value="5000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Аниматоры / Артисты (₽)</label>
            <input type="number" id="pay_actors" value="5000" oninput="calculate()">
        </div>
    </div>

    <div class="results-box">
        <div class="row">
            <span style="color: var(--txt-muted);">Итоговая выручка</span>
            <span id="revenue" class="bold">90 000 ₽</span>
        </div>
        <div class="row">
            <span style="color: var(--txt-muted);">Фонд зарплат подрядчиков</span>
            <span id="total_team" class="bold">33 000 ₽</span>
        </div>
        <div class="row">
            <span style="color: var(--txt-muted);">Всего расходов (с реквизитом)</span>
            <span id="total_expenses" class="bold">39 500 ₽</span>
        </div>
        <div class="divider"></div>
        <div class="row bold profit">
            <span>Чистая прибыль агентства</span>
            <span id="profit">50 500 ₽</span>
        </div>
        <div class="divider"></div>
        <div class="row">
            <span style="color: var(--txt-muted);">Рентабельность проекта (ROI)</span>
            <span id="margin" class="bold">56.1%</span>
        </div>
    </div>

    <button class="btn btn-primary" onclick="saveAsPDF()">Сохранить смету в PDF</button>
    <button class="btn btn-secondary" onclick="resetFields()">Сбросить все поля</button>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    function calculate() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const hours = parseFloat(document.getElementById('hours').value) || 0;
        const guests = parseFloat(document.getElementById('guests').value) || 0;
        const costs = parseFloat(document.getElementById('costs').value) || 0;

        // Подрядчики
        const host = parseFloat(document.getElementById('pay_host').value) || 0;
        const dj = parseFloat(document.getElementById('pay_dj').value) || 0;
        const coord = parseFloat(document.getElementById('pay_coord').value) || 0;
        const actors = parseFloat(document.getElementById('pay_actors').value) || 0;

        const revenue = price * hours * guests;
        const totalTeam = host + dj + coord + actors;
        const totalExpenses = costs + totalTeam;
        const profit = revenue - totalExpenses;
        const margin = revenue > 0 ? ((profit / revenue) * 100).toFixed(1) : 0;

        document.getElementById('revenue').innerText = revenue.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('total_team').innerText = totalTeam.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('total_expenses').innerText = totalExpenses.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('profit').innerText = profit.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('margin').innerText = margin + '%';

        const profitSpan = document.getElementById('profit');
        if (profit >= 0) {
            profitSpan.style.color = '#1E4620';
        } else {
            profitSpan.style.color = '#C62828';
        }
    }

    function resetFields() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => input.value = '');
        calculate();
    }

    function saveAsPDF() {
        window.print();
    }

    calculate();
</script>
</body>
</html>
